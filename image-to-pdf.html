<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-End Scan PDF - Ver 1.30</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f1f5f9; --text: #1e293b; --border: #cbd5e1; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); min-height: 100vh; }
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid #e2e8f0; position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 30px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; position: relative; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .config-group { display: flex; gap: 15px; margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .config-item { flex: 1; }
        label { font-size: 0.8rem; font-weight: bold; color: #64748b; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.95rem; margin-top: 5px; background: #fff; }
        .drop-zone { border: 2px dashed var(--primary); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f9ff; }
        .workspace { display: grid; grid-template-columns: 180px 1fr; gap: 20px; margin-top: 20px; display: none; }
        .file-list { display: flex; flex-direction: column; gap: 10px; max-height: 650px; overflow-y: auto; }
        .thumb-item { border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: #fff; overflow: hidden; position: relative; }
        .thumb-item.active { border-color: var(--primary); box-shadow: 0 0 10px rgba(37,99,235,0.2); }
        .thumb-item img { width: 100%; aspect-ratio: 1/1.4; object-fit: contain; background: #eee; display: block; }
        .thumb-status { position: absolute; top: 3px; right: 3px; background: var(--success); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .editor-main { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
        .stage-wrap { width: 100%; height: 480px; background: #1e293b; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .correction-panel { background: #f1f5f9; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .controls-flex { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
        .tool-group { display: flex; gap: 8px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-sync { background: #ef4444; } /* 同期ボタン：赤 */
        .correction-list { display: flex; gap: 12px; border-left: 2px solid #cbd5e1; padding-left: 15px; }
        .check-item { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: #475569; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-pdf { background: var(--success); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.3rem; margin-top: 25px; display: none; }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main-content">
    <div class="container">
        <h1 style="margin-top: 0; font-size: 1.8rem; color: #0f172a;">📑 Smart PDF Scanner</h1>
        <div class="card">
            <div class="config-group">
                <div class="config-item">
                    <label>出力用紙サイズ</label>
                    <select id="paper-size" onchange="updateAllCropRatios()">
                        <option value="a4">A4 (210x297mm)</option><option value="a3">A3 (297x420mm)</option><option value="b4" selected>B4 (250x353mm)</option>
                    </select>
                </div>
                <div class="config-item">
                    <label>用紙の向き</label>
                    <select id="paper-orientation" onchange="updateAllCropRatios()">
                        <option value="p">縦向き (Portrait)</option><option value="l" selected>横向き (Landscape)</option>
                    </select>
                </div>
            </div>
            <div class="drop-zone" id="drop-zone">
                <strong>ここに写真をドロップ（複数可）</strong>
                <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
            </div>
        </div>

        <div class="workspace" id="workspace">
            <div class="file-list" id="thumb-list"></div>
            <div class="editor-main" id="editor-main">
                <div class="stage-wrap"><img id="stage-image"></div>
                <div class="correction-panel">
                    <div class="controls-flex">
                        <div class="tool-group">
                            <button class="btn-tool" onclick="rotateWithSync(-90)">↺ 左90°</button>
                            <button class="btn-tool" onclick="rotateWithSync(90)">↻ 右90°</button>
                            <button class="btn-tool btn-sync" onclick="syncOrientation()" title="用紙の向きを回転に合わせる">用紙方向を同期</button>
                        </div>
                        <div class="correction-list">
                            <label class="check-item"><input type="checkbox" id="opt-trap" checked> 台形補正</label>
                            <label class="check-item"><input type="checkbox" id="opt-bw" checked> 白黒補正</label>
                            <label class="check-item"><input type="checkbox" id="opt-sharp"> シャープ</label>
                            <label class="check-item"><input type="checkbox" id="opt-white" checked> 背景白飛</label>
                        </div>
                        <button class="btn-confirm" onclick="applyAndNext()">ページ確定</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn-pdf" id="download-pdf">PDFを保存 (全ページ結合)</button>
    </div>
</main>

<script>
    let filesData = []; let activeIdx = -1; let cropper = null;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        for (let file of files) {
            const img = await new Promise(res => {
                const r = new FileReader();
                r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
                r.readAsDataURL(file);
            });
            filesData.push({ orig: img, name: file.name, proc: null });
        }
        document.getElementById('workspace').style.display = 'grid';
        renderThumbnails(); openEditor(filesData.length - files.length);
    }

    function renderThumbnails() {
        const list = document.getElementById('thumb-list'); list.innerHTML = "";
        filesData.forEach((data, i) => {
            const item = document.createElement('div');
            item.className = `thumb-item ${i === activeIdx ? 'active' : ''}`;
            item.innerHTML = `<img src="${data.orig.src}">${data.proc ? '<div class="thumb-status">✓</div>' : ''}`;
            item.onclick = () => openEditor(i); list.appendChild(item);
        });
        document.getElementById('download-pdf').style.display = filesData.some(d => d.proc) ? 'block' : 'none';
    }

    function openEditor(idx) {
        if (cropper) cropper.destroy();
        activeIdx = idx; const data = filesData[idx];
        const img = document.getElementById('stage-image'); img.src = data.orig.src;
        img.onload = () => {
            const sizeKey = document.getElementById('paper-size').value;
            const orient = document.getElementById('paper-orientation').value;
            const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];
            cropper = new Cropper(img, { aspectRatio: ratio, viewMode: 1, autoCropArea: 0.9, background: false });
        };
        document.querySelectorAll('.thumb-item').forEach((it, i) => it.classList.toggle('active', i === idx));
    }

    // ★今回の核心：回転と同時に用紙の向きを同期させる
    function rotateWithSync(deg) {
        if (!cropper) return;
        cropper.rotate(deg);
        // 回転後、必要であれば手動で「用紙方向を同期」を押すか、自動で同期させる
    }

    function syncOrientation() {
        if (!cropper) return;
        const orientSelect = document.getElementById('paper-orientation');
        // 現在の向きを反転させる
        orientSelect.value = (orientSelect.value === 'p') ? 'l' : 'p';
        updateAllCropRatios();
    }

    function updateAllCropRatios() {
        if (!cropper) return;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];
        cropper.setAspectRatio(ratio);
    }

    async function applyAndNext() {
        if (!cropper) return;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        let [pW, pH] = (orient === 'p') ? paperMap[sizeKey] : [paperMap[sizeKey][1], paperMap[sizeKey][0]];

        const croppedCanvas = cropper.getCroppedCanvas({ width: pW * 3.5 });
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = croppedCanvas.width; finalCanvas.height = croppedCanvas.height;
        const ctx = finalCanvas.getContext('2d');

        let filters = [];
        if (document.getElementById('opt-bw').checked) filters.push('grayscale(1)');
        if (document.getElementById('opt-white').checked) filters.push('contrast(1.2) brightness(1.05)');
        if (document.getElementById('opt-sharp').checked) filters.push('saturate(0) contrast(1.1)');
        ctx.filter = filters.length ? filters.join(' ') : 'none';
        ctx.drawImage(croppedCanvas, 0, 0);

        filesData[activeIdx].proc = finalCanvas.toDataURL('image/jpeg', 0.9);
        renderThumbnails();
        if (activeIdx < filesData.length - 1) openEditor(activeIdx + 1);
    }

    document.getElementById('download-pdf').onclick = () => {
        const { jsPDF } = window.jspdf;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(orient, 'mm', sizeKey);
        let added = 0;
        filesData.forEach(d => {
            if (d.proc) {
                if (added > 0) pdf.addPage(sizeKey, orient);
                pdf.addImage(d.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                added++;
            }
        });
        pdf.save(`Scan_Output.pdf`);
    };
</script>
</body>
</html>
