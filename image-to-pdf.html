<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI-Scan to PDF - Ver 1.27</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); min-height: 100vh; }
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 950px; width: 100%; position: relative; }
        .version { position: absolute; top: 0; right: 0; font-size: 0.8rem; font-weight: bold; color: #94a3b8; padding: 2px 8px; border-radius: 4px; background: #eee; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        .drop-zone { border: 2px dashed var(--primary); padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f7ff; transition: 0.3s; }
        
        /* 言語選択スイッチ */
        .lang-selector { display: flex; gap: 20px; margin-bottom: 15px; background: #f1f5f9; padding: 10px 20px; border-radius: 8px; align-items: center; }
        .lang-selector label { font-size: 0.9rem; font-weight: bold; color: #475569; }

        #preview-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .preview-item { border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer; transition: 0.2s; position: relative;}
        .preview-item.active { border-color: var(--primary); box-shadow: 0 0 10px rgba(37,99,235,0.2); }
        .preview-item img { width: 100%; aspect-ratio: 1/1.4; object-fit: contain; background: #f1f5f9; display: block; }
        .file-name { font-size: 0.7rem; color: #64748b; padding: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .editor-area { display: none; margin-top: 20px; border-top: 2px solid var(--border); padding-top: 20px; }
        .editor-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .preview-main { width: 100%; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; height: 500px; }
        .preview-main img { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .control-panel { background: #f1f5f9; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; }
        .control-title { font-weight: bold; font-size: 0.9rem; color: var(--primary); }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; padding: 5px 0; }

        .toolbar { display: flex; gap: 8px; margin-bottom: 5px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; flex: 1; }

        .btn-action { background: var(--success); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.2rem; margin-top: 30px; display: none; }
        #log-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); color: white; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="sidebar-container"></div>
<div id="log-overlay">🧠 <span id="log-text">AI判定中...</span></div>

<main class="main-content">
    <div class="container">
        <div class="version">Ver 1.27</div>
        <h1 style="margin-top: 0; font-size: 1.5rem;">🖼️ AI Multi-Scan (JP/EN)</h1>
        
        <div class="card">
            <div style="display:flex; gap:15px; margin-bottom:15px;">
                <div style="flex:1;"><label>用紙サイズ</label><select id="paper-size" onchange="refreshAll()"><option value="a4">A4</option><option value="a3">A3</option><option value="b4" selected>B4</option></select></div>
                <div style="flex:1;"><label>用紙の向き</label><select id="paper-orientation" onchange="refreshAll()"><option value="p">縦向き</option><option value="l" selected>横向き</option></select></div>
            </div>

            <div class="lang-selector">
                <label>解析言語の設定：</label>
                <label style="cursor:pointer;"><input type="radio" name="ocr-lang" value="jpn" checked> 日本語 (推奨)</label>
                <label style="cursor:pointer;"><input type="radio" name="ocr-lang" value="eng"> 英語のみ</label>
            </div>

            <div class="drop-zone" id="drop-zone">
                <div style="font-size: 32px;">📄</div>
                <strong>画像をアップロード（複数可）</strong>
            </div>
            <input type="file" id="file-input" multiple accept="image/*" style="display:none;">

            <div id="preview-list"></div>
            <button class="btn-action" id="download-pdf">PDFファイルを生成して保存</button>
        </div>

        <div id="editor-area" class="card editor-area">
            <div class="editor-grid">
                <div class="preview-main"><img id="main-preview"></div>
                <div class="control-panel">
                    <div class="control-title">📍 向きの個別調整</div>
                    <div class="toolbar">
                        <button class="btn-tool" onclick="rotateManual(-90)">左90°</button>
                        <button class="btn-tool" onclick="rotateManual(90)">右90°</button>
                    </div>
                    
                    <div class="control-title" style="margin-top:15px;">✨ 個別補正</div>
                    <label class="check-item"><input type="checkbox" id="check-binary" onchange="updateImage()" checked> コントラスト強調</label>
                    <label class="check-item"><input type="checkbox" id="check-bright" onchange="updateImage()" checked> 背景を白く飛ばす</label>
                    <label class="check-item"><input type="checkbox" id="check-grayscale" onchange="updateImage()" checked> 白黒 (モノクロ)</label>
                    
                    <p style="font-size: 0.7rem; color: #64748b; line-height: 1.4; margin-top: 15px;">
                        ※文字が薄すぎる時は「背景を白く飛ばす」をOFFに。
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    let filesData = [];
    let activeIdx = -1;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    const fileInput = document.getElementById('file-input');
    document.getElementById('drop-zone').onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        document.getElementById('log-overlay').style.display = 'flex';
        const targetLang = document.querySelector('input[name="ocr-lang"]:checked').value;
        
        for (let file of files) {
            const img = await loadImage(file);
            document.getElementById('log-text').innerText = `${file.name} を解析中...`;
            const deg = await detectOrientation(img, targetLang);
            
            filesData.push({
                orig: img, deg: deg, 
                binary: true, bright: true, grayscale: true, 
                name: file.name, proc: null
            });
        }
        
        await refreshAll();
        document.getElementById('log-overlay').style.display = 'none';
        document.getElementById('download-pdf').style.display = 'block';
        if (filesData.length > 0) openEditor(filesData.length - 1);
    }

    async function detectOrientation(img, lang) {
        const worker = await Tesseract.createWorker();
        // ユーザーが選択した言語でエンジンを初期化
        await worker.loadLanguage(lang === 'jpn' ? 'jpn+eng' : 'eng');
        await worker.initialize(lang === 'jpn' ? 'jpn+eng' : 'eng');
        const { data } = await worker.detect(img);
        await worker.terminate();
        return data.orientation_degrees || 0;
    }

    function loadImage(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
            r.readAsDataURL(file);
        });
    }

    async function refreshAll() {
        const list = document.getElementById('preview-list');
        list.innerHTML = "";
        for (let i = 0; i < filesData.length; i++) {
            filesData[i].proc = await renderScan(filesData[i]);
            const item = document.createElement('div');
            item.className = `preview-item ${i === activeIdx ? 'active' : ''}`;
            item.innerHTML = `<img src="${filesData[i].proc}"><div class="file-name">${filesData[i].name}</div>`;
            item.onclick = () => openEditor(i);
            list.appendChild(item);
        }
    }

    async function renderScan(data) {
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        let [pW, pH] = paperMap[sizeKey];
        if (orient === 'l') [pW, pH] = [pH, pW];

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = 3.0;
        canvas.width = pW * scale; canvas.height = pH * scale;
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((-data.deg * Math.PI) / 180);

        let imgW = data.orig.width, imgH = data.orig.height;
        if (data.deg % 180 !== 0) [imgW, imgH] = [imgH, imgW];
        const ratio = Math.max(canvas.width / imgW, canvas.height / imgH);
        
        let filters = [];
        if (data.grayscale) filters.push('grayscale(1)');
        if (data.binary) filters.push('contrast(1.25)'); // 白け防止にさらにマイルド化
        if (data.bright) filters.push('brightness(1.04)');
        
        ctx.filter = filters.length ? filters.join(' ') : 'none';
        ctx.drawImage(data.orig, -data.orig.width * ratio / 2, -data.orig.height * ratio / 2, data.orig.width * ratio, data.orig.height * ratio);
        ctx.restore();
        
        return canvas.toDataURL('image/jpeg', 0.9);
    }

    function openEditor(idx) {
        activeIdx = idx;
        const data = filesData[idx];
        document.getElementById('main-preview').src = data.proc;
        document.getElementById('check-binary').checked = data.binary;
        document.getElementById('check-bright').checked = data.bright;
        document.getElementById('check-grayscale').checked = data.grayscale;
        document.getElementById('editor-area').style.display = 'block';
        
        const items = document.querySelectorAll('.preview-item');
        items.forEach((it, i) => it.classList.toggle('active', i === idx));
    }

    async function updateImage() {
        if (activeIdx < 0) return;
        const data = filesData[activeIdx];
        data.binary = document.getElementById('check-binary').checked;
        data.bright = document.getElementById('check-bright').checked;
        data.grayscale = document.getElementById('check-grayscale').checked;
        
        data.proc = await renderScan(data);
        document.getElementById('main-preview').src = data.proc;
        document.querySelectorAll('.preview-item img')[activeIdx].src = data.proc;
    }

    async function rotateManual(val) {
        filesData[activeIdx].deg = (filesData[activeIdx].deg + val) % 360;
        await updateImage();
    }

    document.getElementById('download-pdf').onclick = () => {
        const { jsPDF } = window.jspdf;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(orient, 'mm', sizeKey);
        
        filesData.forEach((data, i) => {
            if (i > 0) pdf.addPage(sizeKey, orient);
            pdf.addImage(data.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
        });
        pdf.save("AI-Scanned-Combined.pdf");
    };
</script>
</body>
</html>
