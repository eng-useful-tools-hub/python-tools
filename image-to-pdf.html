<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-End Scan PDF - Ver 1.29</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f1f5f9; --text: #1e293b; --border: #cbd5e1; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); min-height: 100vh; }
        
        /* サイドバー (sidebar.htmlが読み込まれる前提) */
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid #e2e8f0; position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        
        /* メインコンテンツ */
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 30px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; position: relative; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        
        /* 用紙設定エリア */
        .config-group { display: flex; gap: 15px; margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .config-item { flex: 1; }
        label { font-size: 0.8rem; font-weight: bold; color: #64748b; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.95rem; margin-top: 5px; background: #fff; }

        .drop-zone { border: 2px dashed var(--primary); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f9ff; transition: 0.2s; }
        .drop-zone:hover { background: #e0f2fe; }

        /* ワークスペース (リスト & エディタ) */
        .workspace { display: grid; grid-template-columns: 180px 1fr; gap: 20px; margin-top: 20px; display: none; }
        
        /* 左：サムネイルリスト */
        .file-list { display: flex; flex-direction: column; gap: 10px; max-height: 650px; overflow-y: auto; padding-right: 5px; }
        .thumb-item { border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: #fff; overflow: hidden; position: relative; transition: 0.2s; }
        .thumb-item.active { border-color: var(--primary); box-shadow: 0 0 10px rgba(37,99,235,0.2); }
        .thumb-item img { width: 100%; aspect-ratio: 1/1.4; object-fit: contain; background: #eee; display: block; }
        .thumb-status { position: absolute; top: 3px; right: 3px; background: var(--success); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* 右：スキャナーエディタ */
        .editor-main { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 20px; position: relative; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        
        /* ★プレビューが黒くなる問題の修正: 高さを明示し、Cropper用のコンテナにする */
        .stage-wrap { width: 100%; height: 480px; background: #1e293b; border-radius: 8px; overflow: hidden; margin-bottom: 15px; position: relative; }
        #stage-image { max-width: 100%; display: block; } /* CropperJS用 */

        /* 補正パネル */
        .correction-panel { background: #f1f5f9; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .panel-title { font-weight: bold; font-size: 0.9rem; color: var(--primary); margin-bottom: 10px; }
        .controls-flex { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
        
        .tool-group { display: flex; gap: 8px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-tool:hover { background: #1e293b; }

        /* ご要望の補正リスト */
        .correction-list { display: flex; gap: 15px; border-left: 2px solid #cbd5e1; padding-left: 15px; }
        .check-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: bold; cursor: pointer; color: #475569; }

        .btn-confirm { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-confirm:hover { background: #1d4ed8; }

        /* PDF出力ボタン */
        .btn-pdf { background: var(--success); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.3rem; margin-top: 25px; display: none; transition: 0.2s; }
        .btn-pdf:hover { background: #047857; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(5,150,105,0.3); }
        
        /* CropperのCSSカスタマイズ */
        .cropper-view-box, .cropper-face { border-radius: 0; }
        .cropper-line, .cropper-point { background-color: var(--primary); }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main-content">
    <div class="container">
        <h1 style="margin-top: 0; font-size: 1.8rem; color: #0f172a;">📑 Advanced PDF Scanner</h1>
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">
            画像をドロップし、各ページの台形補正（自由範囲選択）とスキャナー補正を設定してPDF化します。
        </p>

        <div class="card">
            <div class="config-group">
                <div class="config-item">
                    <label>出力用紙サイズ</label>
                    <select id="paper-size" onchange="updateAllCropRatios()">
                        <option value="a4">A4 (210x297mm)</option>
                        <option value="a3">A3 (297x420mm)</option>
                        <option value="b4" selected>B4 (250x353mm)</option>
                    </select>
                </div>
                <div class="config-item">
                    <label>用紙の向き（出力比率）</label>
                    <select id="paper-orientation" onchange="updateAllCropRatios()">
                        <option value="p">縦向き (Portrait)</option>
                        <option value="l" selected>横向き (Landscape)</option>
                    </select>
                </div>
            </div>

            <div class="drop-zone" id="drop-zone">
                <strong>ここに写真をドロップ（複数可）</strong>
                <p style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">台形補正で不要な背景をカットできます</p>
                <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
            </div>
        </div>

        <div class="workspace" id="workspace">
            <div class="file-list" id="thumb-list"></div>
            
            <div class="editor-main" id="editor-main">
                <div class="editor-header">
                    <strong id="current-filename" style="font-size: 1rem;">画像を選択してください</strong>
                    <span id="page-counter" style="color:#64748b; font-size:0.9rem; font-weight:bold;"></span>
                </div>
                
                <div class="stage-wrap" id="stage-wrap">
                    <img id="stage-image">
                </div>

                <div class="correction-panel">
                    <div class="controls-flex">
                        <div class="tool-group">
                            <button class="btn-tool" onclick="cropper.rotate(-90)">↺ 左90°</button>
                            <button class="btn-tool" onclick="cropper.rotate(90)">↻ 右90°</button>
                        </div>
                        
                        <div class="correction-list">
                            <label class="check-item"><input type="checkbox" id="opt-trap" checked> 台形補正(自由フィット)</label>
                            <label class="check-item"><input type="checkbox" id="opt-bw" checked> 白黒補正(モノクロ)</label>
                            <label class="check-item"><input type="checkbox" id="opt-sharp"> シャープエッジ</label>
                            <label class="check-item"><input type="checkbox" id="opt-white" checked> 背景白飛ばし</label>
                        </div>

                        <button class="btn-confirm" onclick="applyAndNext()">このページを確定</button>
                    </div>
                </div>
            </div>
        </div>
        
        <button class="btn-pdf" id="download-pdf">PDFを生成して保存 (全ページ結合)</button>
    </div>
</main>

<script>
    let filesData = []; 
    let activeIdx = -1;
    let cropper = null;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    // サイドバー読込
    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    const fileInput = document.getElementById('file-input');
    document.getElementById('drop-zone').onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        
        // 既存のリストに追加する形にする
        for (let file of files) {
            const img = await loadImage(file);
            filesData.push({
                orig: img, name: file.name, proc: null,
                settings: { trap: true, bw: true, sharp: false, white: true, deg: 0 }
            });
        }
        document.getElementById('workspace').style.display = 'grid';
        renderThumbnails();
        // 新しく追加された最初の画像を開く
        openEditor(filesData.length - files.length);
    }

    function loadImage(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
            r.readAsDataURL(file);
        });
    }

    function renderThumbnails() {
        const list = document.getElementById('thumb-list');
        list.innerHTML = "";
        filesData.forEach((data, i) => {
            const item = document.createElement('div');
            item.className = `thumb-item ${i === activeIdx ? 'active' : ''}`;
            item.innerHTML = `<img src="${data.orig.src}">${data.proc ? '<div class="thumb-status">✓</div>' : ''}`;
            item.onclick = () => openEditor(i);
            list.appendChild(item);
        });
        // 確定済みの画像が1枚でもあればPDFボタンを表示
        document.getElementById('download-pdf').style.display = filesData.some(d => d.proc) ? 'block' : 'none';
    }

    // ★プレビュー黒画面問題の対策を含むエディタ起動関数
    function openEditor(idx) {
        // 現在のCropperを確実に破棄
        if (cropper) {
            cropper.destroy();
            cropper = null;
        }

        activeIdx = idx;
        const data = filesData[idx];
        document.getElementById('current-filename').innerText = data.name;
        document.getElementById('page-counter').innerText = `${idx + 1} / ${filesData.length}`;
        
        const img = document.getElementById('stage-image');
        // 一旦srcを空にしてから設定（キャッシュ対策）
        img.src = "";
        img.src = data.orig.src;

        // 設定値をチェックボックスに反映
        document.getElementById('opt-trap').checked = data.settings.trap;
        document.getElementById('opt-bw').checked = data.settings.bw;
        document.getElementById('opt-sharp').checked = data.settings.sharp;
        document.getElementById('opt-white').checked = data.settings.white;

        // 用紙設定から比率を計算
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        // B4横なら 353 / 250
        const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];

        // ★重要: 画像の読み込み完了を待ってからCropperを初期化する
        img.onload = () => {
            if (cropper) cropper.destroy(); // 念のため
            cropper = new Cropper(img, {
                aspectRatio: ratio, // ★これで指定サイズ・向きに適合させる
                viewMode: 1, // 画像外への露出を防ぐ
                autoCropArea: 0.9, // 最初は少し余裕を持って囲む
                background: false, // Cropper背景のグリッドを消す
                ready() {
                    // 黒画面対策: コンテナのサイズを再計算させる
                    this.cropper.crop();
                }
            });
            // onloadイベントをクリア
            img.onload = null;
        };
        
        // サムネイルのactiveクラス切り替え
        document.querySelectorAll('.thumb-item').forEach((it, i) => it.classList.toggle('active', i === idx));
    }

    // 用紙設定が変わった時にすべてのサムネイルのアスペクト比を更新
    function updateAllCropRatios() {
        if (cropper) {
            const sizeKey = document.getElementById('paper-size').value;
            const orient = document.getElementById('paper-orientation').value;
            const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];
            cropper.setAspectRatio(ratio);
        }
    }

    // ★ご要望の補正リストに基づいた画像処理関数
    async function applyAndNext() {
        if (!cropper) return;

        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        let [pW, pH] = paperMap[sizeKey];
        if (orient === 'l') [pW, pH] = [pH, pW];

        // チェックボックスの状態を取得してデータに保存
        const settings = {
            trap: document.getElementById('opt-trap').checked,
            bw: document.getElementById('opt-bw').checked,
            sharp: document.getElementById('opt-sharp').checked,
            white: document.getElementById('opt-white').checked,
            deg: cropper.getData().rotate // 現在の回転角も保存
        };
        filesData[activeIdx].settings = settings;

        // ★1. 台形補正 & サイズ調整: 指定サイズ（B4等）の比率でトリミング
        // 高解像度（300dpi相当）のキャンバスを取得
        const croppedCanvas = cropper.getCroppedCanvas({ 
            width: pW * 3.5, // 物理サイズに合わせた解像度
            imageSmoothingQuality: 'high'
        });

        // ★2. 各種スキャナー補正の適用
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = croppedCanvas.width;
        finalCanvas.height = croppedCanvas.height;
        const ctx = finalCanvas.getContext('2d');

        let filters = [];
        // ★白黒補正
        if (settings.bw) filters.push('grayscale(1)');
        // ★背景白飛ばし (contrastとbrightnessの複合、白け防止のマイルド設定)
        if (settings.white) filters.push('contrast(1.25) brightness(1.04)');
        // ★シャープエッジ (saturate(0)とcontrast(1.1)でエッジを立たせる簡易実装)
        if (settings.sharp) filters.push('saturate(0) contrast(1.1)');

        ctx.filter = filters.length ? filters.join(' ') : 'none';
        
        // 描画
        ctx.drawImage(croppedCanvas, 0, 0);

        // JPEGデータとして保存（品質高め）
        filesData[activeIdx].proc = finalCanvas.toDataURL('image/jpeg', 0.9);
        
        renderThumbnails();

        // 次の画像へ進む
        if (activeIdx < filesData.length - 1) {
            openEditor(activeIdx + 1);
        } else {
            // 最後の画像ならPDFボタンへスクロール
            document.getElementById('download-pdf').scrollIntoView({behavior: 'smooth'});
        }
    }

    // PDF生成・保存
    document.getElementById('download-pdf').onclick = () => {
        const { jsPDF } = window.jspdf;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        // B4規格サイズでPDF初期化
        const pdf = new jsPDF(orient, 'mm', sizeKey);
        
        let addedPages = 0;
        filesData.forEach((data) => {
            if (data.proc) {
                if (addedPages > 0) pdf.addPage(sizeKey, orient);
                // 用紙いっぱいに配置
                pdf.addImage(data.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                addedPages++;
            }
        });
        pdf.save(`Scanned_B4_Output.pdf`);
    };
</script>
</body>
</html>
