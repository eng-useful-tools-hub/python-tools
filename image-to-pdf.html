<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Smart PDF Scanner - Ver 1.49</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --bg: #f1f5f9; --text: #1e293b; --border: #cbd5e1; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); height: 100vh; overflow: hidden; }
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid #e2e8f0; position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 10px 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .container { max-width: 1600px; width: 100%; position: relative; display: flex; flex-direction: column; height: 100%; }
        .version { position: absolute; top: -5px; right: 0; font-size: 0.7rem; font-weight: bold; color: #94a3b8; padding: 2px 8px; border-radius: 4px; background: #eee; }
        
        h1 { font-size: 1.2rem; margin: 0 0 5px 0; }
        .desc { color: #64748b; font-size: 0.75rem; margin-bottom: 5px; }

        .top-nav { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-bottom: 8px; align-items: end; }
        .card-mini { background: white; padding: 6px 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        select { width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 0.8rem; background: #fff; }
        label { font-size: 0.65rem; font-weight: bold; color: #64748b; display: block; margin-bottom: 1px; }

        /* ワークスペース：左側のサムネイル列を広く(300px)確保 */
        .workspace { display: grid; grid-template-columns: 300px 1fr; gap: 15px; flex: 1; min-height: 0; display: none; margin-bottom: 10px; }
        
        /* サムネイルリスト：1列・大型・独立スクロール */
        .file-list { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto; 
            background: #e5eaf0; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border);
        }
        .thumb-item { 
            border: 3px solid #cbd5e1; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #fff; 
            position: relative; 
            padding: 4px; 
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .thumb-item.active { 
            border-color: var(--primary); 
            background: #fff; 
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
            transform: scale(1.01);
        }
        .thumb-item img { width: 100%; aspect-ratio: 1.4/1; object-fit: contain; background: #eee; display: block; border-radius: 4px; }
        .thumb-info { font-size: 0.75rem; text-align: center; color: #475569; margin-top: 5px; font-weight: bold; }
        .thumb-status { position: absolute; top: -10px; right: -10px; background: var(--success); color: white; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .editor-main { background: white; border-radius: 8px; border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; min-height: 0; }
        .stage-wrap { flex: 1; background: #0f172a; border-radius: 6px; overflow: hidden; margin-bottom: 8px; position: relative; display: flex; align-items: center; justify-content: center; }
        #stage-image { display: block; max-width: 100%; }

        .correction-panel { background: #f8fafc; padding: 10px 15px; border-radius: 6px; border: 1px solid #cbd5e1; }
        .controls-flex { display: flex; justify-content: space-between; align-items: center; }
        .tool-group { display: flex; gap: 8px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-reset { background: var(--danger); }
        
        .correction-list { display: flex; gap: 15px; }
        .check-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: bold; cursor: pointer; color: #475569; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        
        .btn-pdf { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.1rem; display: none; margin-bottom: 10px; }

        /* 免責事項エリア */
        .disclaimer { 
            font-size: 10px; 
            color: #94a3b8; 
            text-align: center; 
            padding: 10px 0; 
            line-height: 1.5; 
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main-content">
    <div class="container">
        <div class="version">Ver 1.49</div>
        <h1>📑 Smart PDF Scanner</h1>
        <p class="desc">左側のサムネイルから画像を選択し、個別に調整してください。確定したページがPDFに保存されます。</p>
        
        <div class="top-nav">
            <div class="card-mini">
                <label>用紙サイズ</label>
                <select id="paper-size" onchange="updateRatio()"><option value="a4">A4</option><option value="a3">A3</option><option value="b4" selected>B4</option></select>
            </div>
            <div class="card-mini">
                <label>出力向き</label>
                <select id="paper-orientation" onchange="updateRatio()"><option value="p">縦</option><option value="l" selected>横</option></select>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-tool btn-reset" style="flex:1" onclick="resetAll()">全リセット</button>
                <div id="drop-zone" class="card-mini" style="flex:2; border: 2px dashed var(--primary); background: #f0f9ff; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 0.8rem; font-weight: bold; color: var(--primary);">📥 追加ドロップ</span>
                </div>
            </div>
            <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
        </div>

        <div class="workspace" id="workspace">
            <div class="file-list" id="thumb-list"></div>
            <div class="editor-main">
                <div class="stage-wrap"><img id="stage-image"></div>
                <div class="correction-panel">
                    <div class="controls-flex">
                        <div class="tool-group">
                            <button class="btn-tool" onclick="rotateImg(-90)">↺ 左回転</button>
                            <button class="btn-tool" onclick="rotateImg(90)">↻ 右回転</button>
                            <button class="btn-tool" style="background:#0ea5e9" onclick="smartFit()">書類にフィット</button>
                        </div>
                        <div class="correction-list">
                            <label class="check-item"><input type="checkbox" id="opt-bw" checked onchange="updatePreview()"> 白黒</label>
                            <label class="check-item"><input type="checkbox" id="opt-sharp" onchange="updatePreview()"> 鮮明</label>
                            <label class="check-item"><input type="checkbox" id="opt-white" checked onchange="updatePreview()"> 背景白</label>
                        </div>
                        <button class="btn-confirm" onclick="applyPage()">ページ確定</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn-pdf" id="download-pdf-btn">✓の全ページをPDF保存</button>

        <div class="disclaimer">
            【免責事項・ご注意】<br>
            ・本ツールは個人開発のWebアプリです。処理はすべてブラウザ内で完結し、外部へファイルが送られることはありません。<br>
            ・暗号化やパスワード保護が施されたPDFは解析できずエラーになる場合があります。<br>
            ・本ツールの使用によるデータの損失等について、製作者は一切の責任を負いかねます。
        </div>
    </div>
</main>

<script>
    let filesData = []; let activeIdx = -1; let cropper = null;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        const currentCount = filesData.length;
        for (let file of Array.from(files).slice(0, 30 - currentCount)) {
            const img = await new Promise(res => {
                const r = new FileReader();
                r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
                r.readAsDataURL(file);
            });
            filesData.push({ orig: img, proc: null, settings: { bw:true, sharp:false, white:true, deg:0, crop:null } });
        }
        document.getElementById('workspace').style.display = 'grid';
        renderThumbs(); openEditor(currentCount); 
    }

    function resetAll() {
        if(!confirm("リセットしますか？")) return;
        filesData = []; activeIdx = -1; if(cropper) cropper.destroy();
        document.getElementById('workspace').style.display = 'none';
        document.getElementById('download-pdf-btn').style.display = 'none';
        document.getElementById('thumb-list').innerHTML = "";
    }

    function renderThumbs() {
        const list = document.getElementById('thumb-list'); list.innerHTML = "";
        let count = 0;
        filesData.forEach((d, i) => {
            const div = document.createElement('div');
            div.className = `thumb-item ${i === activeIdx ? 'active' : ''}`;
            div.id = `thumb-${i}`;
            div.innerHTML = `<img src="${d.orig.src}"><div class="thumb-info">P.${i+1}</div>${d.proc ? '<div class="thumb-status">✓</div>' : ''}`;
            div.onclick = () => { saveSettings(); openEditor(i); };
            list.appendChild(div);
            if (d.proc) count++;
        });
        const btn = document.getElementById('download-pdf-btn');
        btn.innerText = `✓の全ページ (${count}枚) をPDF保存`;
        btn.style.display = count > 0 ? 'block' : 'none';
        
        if (activeIdx >= 0) {
            const el = document.getElementById(`thumb-${activeIdx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function openEditor(idx) {
        if (cropper) cropper.destroy();
        activeIdx = idx; const d = filesData[idx];
        const img = document.getElementById('stage-image'); img.src = d.orig.src;
        document.getElementById('opt-bw').checked = d.settings.bw;
        document.getElementById('opt-sharp').checked = d.settings.sharp;
        document.getElementById('opt-white').checked = d.settings.white;
        
        img.onload = () => {
            const s = document.getElementById('paper-size').value;
            const o = document.getElementById('paper-orientation').value;
            cropper = new Cropper(img, {
                aspectRatio: (o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0],
                viewMode: 1, background: false, autoCropArea: 1, responsive: true,
                ready() {
                    if (d.settings.deg !== 0) cropper.rotate(d.settings.deg);
                    if (d.settings.crop) cropper.setData(d.settings.crop);
                    else smartFit();
                    updatePreview();
                }
            });
            img.onload = null;
        };
        document.querySelectorAll('.thumb-item').forEach((it, i) => it.classList.toggle('active', i === idx));
    }

    function saveSettings() {
        if (!cropper || activeIdx < 0) return;
        filesData[activeIdx].settings = {
            bw: document.getElementById('opt-bw').checked,
            sharp: document.getElementById('opt-sharp').checked,
            white: document.getElementById('opt-white').checked,
            deg: cropper.getData().rotate,
            crop: cropper.getData()
        };
    }

    function updatePreview() {
        if (!cropper) return;
        const bw = document.getElementById('opt-bw').checked;
        const sh = document.getElementById('opt-sharp').checked;
        const wh = document.getElementById('opt-white').checked;
        let f = "";
        if (bw) f += "grayscale(1) ";
        if (wh) f += "contrast(1.2) brightness(1.05) ";
        if (sh) f += "saturate(0) contrast(1.1) ";
        const wrap = document.querySelector('.cropper-container');
        if (wrap) wrap.style.filter = f || "none";
        saveSettings();
    }

    function rotateImg(deg) { 
        if (cropper) { 
            cropper.rotate(deg); cropper.zoomTo(0);
            setTimeout(() => { smartFit(); }, 50); 
        } 
    }

    function smartFit() {
        if (!cropper) return;
        const canvasData = cropper.getCanvasData();
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        const targetRatio = (o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0];
        const imgWidth = canvasData.width; const imgHeight = canvasData.height;
        const imgRatio = imgWidth / imgHeight;

        let finalWidth, finalHeight;
        if (imgRatio > targetRatio) {
            finalHeight = imgHeight; finalWidth = imgHeight * targetRatio;
        } else {
            finalWidth = imgWidth; finalHeight = imgWidth / targetRatio;
        }

        cropper.setCropBoxData({
            left: canvasData.left + (imgWidth - finalWidth) / 2,
            top: canvasData.top + (imgHeight - finalHeight) / 2,
            width: finalWidth, height: finalHeight
        });
        updatePreview();
    }

    function updateRatio() { 
        if (!cropper) return;
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        cropper.setAspectRatio((o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0]);
        smartFit(); 
    }

    function applyPage() {
        if (!cropper) return;
        saveSettings();
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        let [pW, pH] = (o === 'p') ? paperMap[s] : [paperMap[s][1], paperMap[s][0]];
        const canv = cropper.getCroppedCanvas({ width: pW * 3.5 });
        const final = document.createElement('canvas');
        final.width = canv.width; final.height = canv.height;
        const ctx = final.getContext('2d');
        const set = filesData[activeIdx].settings;
        let f = "";
        if (set.bw) f += "grayscale(1) ";
        if (set.white) f += "contrast(1.2) brightness(1.05) ";
        if (set.sharp) f += "saturate(0) contrast(1.1) ";
        ctx.filter = f || "none";
        ctx.drawImage(canv, 0, 0);
        filesData[activeIdx].proc = final.toDataURL('image/jpeg', 0.9);
        renderThumbs();
        if (activeIdx < filesData.length - 1) openEditor(activeIdx + 1);
    }

    document.getElementById('download-pdf-btn').onclick = () => {
        const { jsPDF } = window.jspdf;
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(o, 'mm', s);
        let added = 0;
        filesData.forEach((d) => {
            if (d.proc) {
                if (added > 0) pdf.addPage(s, o);
                pdf.addImage(d.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                added++;
            }
        });
        if (added > 0) pdf.save(`Scan_Combined_v1.49.pdf`);
    };
</script>
</body>
</html>
