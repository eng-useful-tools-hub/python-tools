<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Speed-Scan PDF - Ver 1.28</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); min-height: 100vh; }
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; position: relative; }
        .version { position: absolute; top: 0; right: 0; font-size: 0.8rem; font-weight: bold; color: #94a3b8; padding: 2px 8px; border-radius: 4px; background: #eee; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        .drop-zone { border: 2px dashed var(--primary); padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f7ff; transition: 0.2s; }

        /* リストとエディタの横並びレイアウト */
        .workspace { display: grid; grid-template-columns: 200px 1fr; gap: 20px; margin-top: 20px; display: none; }
        
        /* 左側：画像リスト */
        .file-list { display: flex; flex-direction: column; gap: 10px; max-height: 600px; overflow-y: auto; padding-right: 5px; }
        .thumb-item { border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: #fff; overflow: hidden; position: relative; }
        .thumb-item.active { border-color: var(--primary); }
        .thumb-item img { width: 100%; aspect-ratio: 1/1.4; object-fit: contain; background: #eee; display: block; }
        .thumb-status { position: absolute; top: 2px; right: 2px; background: var(--success); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; display: flex; align-items: center; justify-content: center; }

        /* 右側：編集エリア */
        .editor-main { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
        .crop-wrap { width: 100%; height: 450px; background: #0f172a; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        
        .control-panel { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; padding: 15px; background: #f1f5f9; border-radius: 8px; }
        .tool-group { display: flex; gap: 8px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .check-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

        .btn-save-all { background: var(--success); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main-content">
    <div class="container">
        <div class="version">Ver 1.28</div>
        <h1 style="margin-top: 0; font-size: 1.6rem;">🖼️ Speed-Scan PDF Cropper</h1>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
            画像をドロップし、各画像の範囲をB4枠に合わせて確定してください。AIなしの高速動作モデルです。
        </p>

        <div class="card">
            <div style="display:flex; gap:15px; margin-bottom:15px;">
                <div style="flex:1;"><label>用紙サイズ</label><select id="paper-size" onchange="updateAllRatios()"><option value="a4">A4</option><option value="a3">A3</option><option value="b4" selected>B4</option></select></div>
                <div style="flex:1;"><label>用紙の向き</label><select id="paper-orientation" onchange="updateAllRatios()"><option value="p">縦向き</option><option value="l" selected>横向き</option></select></div>
            </div>

            <div class="drop-zone" id="drop-zone">
                <strong>ここに写真をドロップ（複数可）</strong>
                <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
            </div>
        </div>

        <div class="workspace" id="workspace">
            <div class="file-list" id="thumb-list"></div>
            
            <div class="editor-main">
                <div class="edit-header" style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <strong id="current-name">画像を選択してください</strong>
                    <span id="page-count" style="color:#64748b; font-size:0.9rem;"></span>
                </div>
                
                <div class="crop-wrap">
                    <img id="crop-target">
                </div>

                <div class="control-panel">
                    <div class="tool-group">
                        <button class="btn-tool" onclick="cropper.rotate(-90)">↺ 左90°</button>
                        <button class="btn-tool" onclick="cropper.rotate(90)">↻ 右90°</button>
                    </div>
                    <div class="tool-group" style="margin-left:auto; gap:15px;">
                        <label class="check-item"><input type="checkbox" id="check-scan" checked> スキャン風補正</label>
                        <label class="check-item"><input type="checkbox" id="check-white" checked> 背景白飛ばし</label>
                        <button class="btn-tool" style="background:var(--primary);" onclick="applyCurrent()">この画像を確定して次へ</button>
                    </div>
                </div>
            </div>
        </div>
        
        <button class="btn-save-all" id="download-pdf" style="display:none;">PDFを書き出す (全ページ結合)</button>
    </div>
</main>

<script>
    let filesData = []; 
    let activeIdx = -1;
    let cropper = null;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    const fileInput = document.getElementById('file-input');
    document.getElementById('drop-zone').onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        for (let file of files) {
            const img = await loadImage(file);
            filesData.push({
                orig: img, name: file.name, proc: null,
                binary: true, bright: true, deg: 0
            });
        }
        document.getElementById('workspace').style.display = 'grid';
        renderThumbnails();
        openEditor(filesData.length - files.length);
    }

    function loadImage(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
            r.readAsDataURL(file);
        });
    }

    function renderThumbnails() {
        const list = document.getElementById('thumb-list');
        list.innerHTML = "";
        filesData.forEach((data, i) => {
            const item = document.createElement('div');
            item.className = `thumb-item ${i === activeIdx ? 'active' : ''}`;
            item.innerHTML = `<img src="${data.orig.src}">${data.proc ? '<div class="thumb-status">✓</div>' : ''}`;
            item.onclick = () => openEditor(i);
            list.appendChild(item);
        });
        document.getElementById('download-pdf').style.display = filesData.some(d => d.proc) ? 'block' : 'none';
    }

    function openEditor(idx) {
        activeIdx = idx;
        const data = filesData[idx];
        document.getElementById('current-name').innerText = data.name;
        document.getElementById('page-count').innerText = `${idx + 1} / ${filesData.length}`;
        
        const img = document.getElementById('crop-target');
        img.src = data.orig.src;
        if (cropper) cropper.destroy();

        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];

        cropper = new Cropper(img, {
            aspectRatio: ratio,
            viewMode: 1,
            autoCropArea: 0.9,
            background: false
        });
        
        document.querySelectorAll('.thumb-item').forEach((it, i) => it.classList.toggle('active', i === idx));
    }

    function updateAllRatios() {
        if (cropper) {
            const sizeKey = document.getElementById('paper-size').value;
            const orient = document.getElementById('paper-orientation').value;
            const ratio = (orient === 'p') ? paperMap[sizeKey][0]/paperMap[sizeKey][1] : paperMap[sizeKey][1]/paperMap[sizeKey][0];
            cropper.setAspectRatio(ratio);
        }
    }

    async function applyCurrent() {
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        let [pW, pH] = paperMap[sizeKey];
        if (orient === 'l') [pW, pH] = [pH, pW];

        // 高画質キャンバス取得 (B4なら300dpi相当)
        const canvas = cropper.getCroppedCanvas({ width: pW * 3.5 });
        const ctx = canvas.getContext('2d');

        const useBinary = document.getElementById('check-scan').checked;
        const useBright = document.getElementById('check-white').checked;

        // 補正処理（白け防止のマイルド設定）
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
        const tCtx = tempCanvas.getContext('2d');
        
        let filter = "grayscale(1) ";
        if (useBinary) filter += "contrast(1.2) ";
        if (useBright) filter += "brightness(1.05) ";
        
        tCtx.filter = filter;
        tCtx.drawImage(canvas, 0, 0);

        filesData[activeIdx].proc = tempCanvas.toDataURL('image/jpeg', 0.92);
        
        renderThumbnails();
        if (activeIdx < filesData.length - 1) {
            openEditor(activeIdx + 1);
        } else {
            document.getElementById('download-pdf').scrollIntoView({behavior: 'smooth'});
        }
    }

    document.getElementById('download-pdf').onclick = () => {
        const { jsPDF } = window.jspdf;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(orient, 'mm', sizeKey);
        
        let addedPages = 0;
        filesData.forEach((data) => {
            if (data.proc) {
                if (addedPages > 0) pdf.addPage(sizeKey, orient);
                pdf.addImage(data.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                addedPages++;
            }
        });
        pdf.save("Scanned_B4_Combined.pdf");
    };
</script>
</body>
</html>
