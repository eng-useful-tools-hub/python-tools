<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PDF Scanner - Ver 1.57.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --warning: #fff7ed; --bg: #f1f5f9; --text: #1e293b; --border: #cbd5e1; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); height: 100vh; overflow: hidden; }
        
        #pc-sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid #e2e8f0; height: 100vh; display: flex; flex-direction: column; flex-shrink: 0; }
        .main-content { flex: 1; padding: 10px 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        .container { max-width: 1200px; width: 100%; margin: 0 auto; position: relative; display: flex; flex-direction: column; min-height: 100%; }
        
        h1 { font-size: 1.1rem; margin: 0 0 5px 0; }

        /* ★ テキストサイズを 1rem に調整 */
        .guide-area { background: #eff6ff; border-left: 4px solid var(--primary); padding: 12px; margin-bottom: 8px; border-radius: 4px; }
        .guide-area p { font-size: 1rem; margin: 0 0 6px 0; line-height: 1.5; }
        
        .limit-box { background: var(--warning); border: 1px solid #ffedd5; padding: 10px; margin-bottom: 8px; border-radius: 8px; }
        .limit-box span { font-size: 0.85rem; color: #9a3412; font-weight: bold; }

        .top-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
        .card-mini { background: white; padding: 5px 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        select { width: 100%; padding: 3px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 0.85rem; }
        label { font-size: 0.65rem; font-weight: bold; color: #64748b; display: block; }

        .workspace { display: grid; grid-template-columns: 160px 1fr; gap: 10px; flex: 1; min-height: 0; display: none; margin-bottom: 8px; }
        .file-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; background: #e5eaf0; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        .thumb-item { border: 2px solid #cbd5e1; border-radius: 6px; cursor: pointer; background: #fff; position: relative; padding: 2px; flex-shrink: 0; }
        .thumb-item.active { border-color: var(--primary); }
        .thumb-item img { width: 100%; aspect-ratio: 1.4/1; object-fit: contain; background: #eee; display: block; }
        .thumb-status { position: absolute; top: -5px; right: -5px; background: var(--success); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid white; z-index: 5; }

        .editor-main { background: white; border-radius: 8px; border: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; }
        .stage-wrap { height: 400px; background: #0f172a; border-radius: 6px; overflow: hidden; margin-bottom: 8px; position: relative; display: flex; align-items: center; justify-content: center; }
        #stage-image { display: block; max-width: 100%; max-height: 100%; }

        .correction-panel { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; }
        .controls-flex { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-tool { background: #475569; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .correction-list { display: flex; flex-wrap: wrap; gap: 5px; }
        .check-item { display: flex; align-items: center; gap: 3px; font-size: 0.75rem; font-weight: bold; cursor: pointer; background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd; }

        .btn-pdf { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 5px; display: none; }
        .footer-disclaimer { font-size: 11px; color: #64748b; text-align: center; padding: 15px 0; line-height: 1.6; border-top: 1px solid #e2e8f0; background: #fff; margin-top: auto; }

        @media (max-width: 768px) {
            #pc-sidebar { display: none; }
            body { overflow-y: auto; height: auto; }
            .main-content { padding: 8px; height: auto; }
            .workspace { grid-template-columns: 1fr; display: flex; flex-direction: column; }
            .file-list { flex-direction: row; overflow-x: auto; height: 110px; padding: 5px; }
            .thumb-item { width: 120px; height: 90px; }
            .editor-main { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 10px; }
            .stage-wrap { width: 55%; height: 28vh; min-height: 200px; margin-bottom: 0; }
            .correction-panel { width: 40%; flex: 1; padding: 5px; }
            .controls-flex { flex-direction: column; align-items: stretch; }
            .tool-group { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
            .correction-list { flex-direction: column; gap: 4px; }
            .btn-confirm { width: 100%; padding: 12px 5px; }
            .guide-area p { font-size: 0.9rem; } /* スマホでは少しだけ抑える */
        }
    </style>
</head>
<body>

<aside id="pc-sidebar"></aside>

<main class="main-content">
    <div class="container">
        <div class="version">Ver 1.57.1</div>
        <h1>📑 Smart PDF Scanner</h1>

        <div class="guide-area">
            <p>・このツールは主に複数の画像ファイルをPDFにするためを想定したツールです。</p>
            <p><strong>【手順】</strong> 1. 読み込み → 2. 画像調整 → 3. ページ確定 → 4. PDF保存</p>
        </div>

        <div class="limit-box">
            <span>💡 <b>ご利用の目安：</b> 推奨サイズは200MB程度です。デバイスのメモリ状況により時間がかかる場合があります。</span>
        </div>
        
        <button class="btn-tool" style="background:var(--danger); width:100%; margin-bottom:8px;" onclick="resetAll()">全てのデータを初期化して読み直す</button>

        <div class="top-nav">
            <div class="card-mini"><label>用紙サイズ</label><select id="paper-size" onchange="updateRatio()"><option value="a4">A4</option><option value="a3">A3</option><option value="b4" selected>B4</option></select></div>
            <div class="card-mini"><label>向き</label><select id="paper-orientation" onchange="updateRatio()"><option value="p">縦</option><option value="l" selected>横</option></select></div>
            <div id="drop-zone" class="card-mini" style="border: 1px dashed var(--primary); background: #f0f9ff; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center;">
                <span style="font-size: 0.7rem; font-weight: bold; color: var(--primary);">📥 追加ドロップ</span>
            </div>
            <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
        </div>

        <div class="workspace" id="workspace">
            <div class="file-list" id="thumb-list"></div>
            <div class="editor-main">
                <div class="stage-wrap"><img id="stage-image"></div>
                <div class="correction-panel">
                    <div class="controls-flex">
                        <div class="tool-group">
                            <button class="btn-tool" onclick="rotateImg(-90)">↺</button>
                            <button class="btn-tool" onclick="rotateImg(90)">↻</button>
                            <button class="btn-tool" style="background:#0ea5e9; grid-column: span 2;" onclick="smartFit()">フィット</button>
                        </div>
                        <div class="correction-list">
                            <label class="check-item"><input type="checkbox" id="opt-bw" checked onchange="updatePreview()">白黒</label>
                            <label class="check-item"><input type="checkbox" id="opt-white" checked onchange="updatePreview()">背景白</label>
                            <label class="check-item"><input type="checkbox" id="opt-shadow" onchange="updatePreview()">影消し</label>
                            <label class="check-item"><input type="checkbox" id="opt-sharp" onchange="updatePreview()">シャープ</label>
                        </div>
                        <button class="btn-confirm" onclick="applyPage()">ページ確定</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn-pdf" id="download-pdf-btn">PDF保存</button>

        <div class="footer-disclaimer">
            【免責事項・ご注意】<br>
            ・本ツールは個人開発のWebアプリです。処理はすべてブラウザ内で完結します。<br>
            ・パスワード保護されたPDFは解析できません。<br>
            ・本ツールの使用によるデータの損失等について一切の責任を負いかねます。
        </div>
    </div>
</main>

<script>
    // 内部ロジックは Ver 1.57 を維持
    let filesData = []; let activeIdx = -1; let cropper = null;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => { document.getElementById('pc-sidebar').innerHTML = html; }).catch(() => { document.getElementById('pc-sidebar').innerHTML = '<div style="padding:15px;">Menu</div>'; });

    document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        const currentCount = filesData.length;
        for (let file of Array.from(files).slice(0, 30 - currentCount)) {
            const img = await new Promise(res => {
                const r = new FileReader();
                r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
                r.readAsDataURL(file);
            });
            filesData.push({ orig: img, proc: null, settings: { bw:true, white:true, shadow:false, sharp:false, deg:0, crop:null } });
        }
        document.getElementById('workspace').style.display = (window.innerWidth > 768) ? 'grid' : 'flex';
        renderThumbs(); openEditor(currentCount); 
    }

    function resetAll() { if(confirm("リセットしますか？")) { location.reload(); } }

    function renderThumbs() {
        const list = document.getElementById('thumb-list'); list.innerHTML = "";
        let count = 0;
        filesData.forEach((d, i) => {
            const div = document.createElement('div');
            div.className = `thumb-item ${i === activeIdx ? 'active' : ''}`;
            div.innerHTML = `<img src="${d.orig.src}"><div class="thumb-info">P.${i+1}</div>${d.proc ? '<div class="thumb-status">✓</div>' : ''}`;
            div.onclick = () => { saveSettings(); openEditor(i); };
            list.appendChild(div);
            if (d.proc) count++;
        });
        const btn = document.getElementById('download-pdf-btn');
        btn.innerText = `${count}枚をPDF保存`;
        btn.style.display = count > 0 ? 'block' : 'none';
    }

    function openEditor(idx) {
        if (cropper) cropper.destroy();
        activeIdx = idx; const d = filesData[idx];
        const img = document.getElementById('stage-image'); img.src = d.orig.src;
        ['bw', 'white', 'shadow', 'sharp'].forEach(k => { document.getElementById(`opt-${k}`).checked = d.settings[k]; });
        img.onload = () => {
            const s = document.getElementById('paper-size').value;
            const o = document.getElementById('paper-orientation').value;
            cropper = new Cropper(img, {
                aspectRatio: (o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0],
                viewMode: 1, background: false, autoCropArea: 1, responsive: true,
                ready() {
                    if (d.settings.deg !== 0) cropper.rotate(d.settings.deg);
                    if (d.settings.crop) cropper.setData(d.settings.crop);
                    else smartFit();
                    updatePreview();
                }
            });
            img.onload = null;
        };
    }

    function saveSettings() {
        if (!cropper || activeIdx < 0) return;
        filesData[activeIdx].settings = {
            bw: document.getElementById('opt-bw').checked,
            white: document.getElementById('opt-white').checked,
            shadow: document.getElementById('opt-shadow').checked,
            sharp: document.getElementById('opt-sharp').checked,
            deg: cropper.getData().rotate,
            crop: cropper.getData()
        };
    }

    function updatePreview() {
        if (!cropper) return;
        const shd = document.getElementById('opt-shadow').checked;
        const bw = document.getElementById('opt-bw').checked;
        const wh = document.getElementById('opt-white').checked;
        const s = document.getElementById('opt-sharp').checked;
        let f = "";
        if (bw) f += "grayscale(1) ";
        if (wh) f += "contrast(1.1) brightness(1.05) ";
        if (shd) f += "brightness(1.2) contrast(0.95) saturate(0.8) ";
        if (s) f += "contrast(1.1) brightness(1.1) saturate(0) ";
        const wrap = document.querySelector('.cropper-container');
        if (wrap) wrap.style.filter = f || "none";
        saveSettings();
    }

    function rotateImg(deg) { if (cropper) { cropper.rotate(deg); cropper.zoomTo(0); setTimeout(() => { smartFit(); }, 50); } }

    function smartFit() {
        if (!cropper) return;
        const canvasData = cropper.getCanvasData();
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        const targetRatio = (o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0];
        const imgW = canvasData.width; const imgH = canvasData.height;
        const imgRatio = imgW / imgH;
        let nW = imgW, nH = imgH;
        if (imgRatio > targetRatio) nW = nH * targetRatio; else nH = nW / targetRatio;
        cropper.setCropBoxData({ left: canvasData.left + (imgW - nW) / 2, top: canvasData.top + (imgH - nH) / 2, width: nW, height: nH });
        updatePreview();
    }

    function updateRatio() { if (!cropper) return; const s = document.getElementById('paper-size').value; const o = document.getElementById('paper-orientation').value; cropper.setAspectRatio((o === 'p') ? paperMap[s][0]/paperMap[s][1] : paperMap[s][1]/paperMap[s][0]); smartFit(); }

    function applyPage() {
        if (!cropper) return;
        saveSettings();
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        let [pW, pH] = (o === 'p') ? paperMap[s] : [paperMap[s][1], paperMap[s][0]];
        const canv = cropper.getCroppedCanvas({ width: pW * 3.5 });
        const final = document.createElement('canvas');
        final.width = canv.width; final.height = canv.height;
        const ctx = final.getContext('2d');
        const set = filesData[activeIdx].settings;
        let f = "";
        if (set.bw) f += "grayscale(1) ";
        if (set.white) f += "contrast(1.1) brightness(1.05) ";
        if (set.shadow) f += "brightness(1.2) contrast(0.95) saturate(0.8) ";
        if (set.sharp) f += "contrast(1.1) brightness(1.1) saturate(0) ";
        ctx.filter = f || "none";
        ctx.drawImage(canv, 0, 0);
        filesData[activeIdx].proc = final.toDataURL('image/jpeg', 0.9);
        renderThumbs();
        if (activeIdx < filesData.length - 1) openEditor(activeIdx + 1);
    }

    document.getElementById('download-pdf-btn').onclick = () => {
        const { jsPDF } = window.jspdf;
        const s = document.getElementById('paper-size').value;
        const o = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(o, 'mm', s);
        let added = 0;
        filesData.forEach((d) => { if (d.proc) { if (added > 0) pdf.addPage(s, o); pdf.addImage(d.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight()); added++; } });
        if (added > 0) pdf.save(`Scan_Combined_v1.57.pdf`);
    };
</script>
</body>
</html>
