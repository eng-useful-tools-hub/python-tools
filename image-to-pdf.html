<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI-Scan to PDF - Ver 1.24</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --sidebar-width: 260px; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); min-height: 100vh; }
        #sidebar-container { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; position: relative; }
        .version { position: absolute; top: 0; right: 0; font-size: 0.8rem; font-weight: bold; color: #94a3b8; padding: 2px 8px; border-radius: 4px; background: #eee; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        .drop-zone { border: 2px dashed var(--primary); padding: 50px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f7ff; transition: 0.3s; }
        
        /* プレビューエリア */
        #preview-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .preview-item { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .preview-item:hover { transform: scale(1.02); border-color: var(--primary); }
        .preview-item img { width: 100%; height: auto; display: block; }
        .file-name { font-size: 0.75rem; color: #64748b; padding: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 比較・調整エリア */
        .comparison-area { display: none; margin-top: 30px; padding-top: 20px; border-top: 2px solid var(--border); }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .img-wrap { width: 100%; aspect-ratio: 1/1.4; background: #eee; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .btn-tool { background: #475569; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-action { background: var(--success); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.2rem; margin-top: 30px; display: none; }
        
        #log-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); color: white; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="sidebar-container"></div>
<div id="log-overlay">🧠 <span id="log-text">解析中...</span></div>

<main class="main-content">
    <div class="container">
        <div class="version">Ver 1.24</div>
        <h1 style="margin-top: 0; margin-bottom: 5px;">🖼️ AI-Powered Auto-Scanner</h1>
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">
            AIが書類の向きを自動判定し、スキャン風の補正をかけてPDF化します。向きが正しくない場合は、画像をクリックして手動で修正できます。
        </p>

        <div class="card">
            <div style="display:flex; gap:15px; margin-bottom:15px;">
                <div style="flex:1;">
                    <label style="font-size:0.8rem; font-weight:bold; color:#64748b;">用紙サイズ</label>
                    <select id="paper-size" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);">
                        <option value="a4">A4</option><option value="a3">A3</option><option value="b4" selected>B4</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label style="font-size:0.8rem; font-weight:bold; color:#64748b;">用紙の向き</label>
                    <select id="paper-orientation" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);">
                        <option value="p">縦向き</option><option value="l" selected>横向き</option>
                    </select>
                </div>
            </div>

            <div class="drop-zone" id="drop-zone">
                <div style="font-size: 40px;">📂</div>
                <strong>画像をアップロード</strong>
                <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
            </div>

            <div id="preview-list"></div>
            <button class="btn-action" id="download-pdf">すべての画像をPDFで保存</button>
        </div>

        <div id="comparison-area" class="card comparison-area">
            <h3 style="margin-top:0;">🔧 向きの微調整</h3>
            <div class="toolbar">
                <button class="btn-tool" onclick="rotateCurrent(-90)">↺ 左90°回転</button>
                <button class="btn-tool" onclick="rotateCurrent(90)">↻ 右90°回転</button>
                <button class="btn-tool" onclick="rotateCurrent(180)">↕ 180°反転</button>
            </div>
            <div class="comparison-grid">
                <div style="text-align:center;"><p style="font-size:0.8rem; color:#64748b;">元画像</p><div class="img-wrap"><img id="comp-orig"></div></div>
                <div style="text-align:center;"><p style="font-size:0.8rem; color:#64748b;">PDF出力イメージ</p><div class="img-wrap"><img id="comp-proc"></div></div>
            </div>
        </div>
    </div>
</main>

<script>
    let processedImagesData = [];
    let activeIndex = -1;
    const paperMap = { a4: [210, 297], a3: [297, 420], b4: [250, 353] };

    fetch('sidebar.html').then(res => res.text()).then(html => document.getElementById('sidebar-container').innerHTML = html);

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    async function handleFiles(files) {
        if (!files.length) return;
        document.getElementById('log-overlay').style.display = 'flex';
        processedImagesData = [];
        document.getElementById('preview-list').innerHTML = "";
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const origImg = await loadImage(file);
            
            const worker = await Tesseract.createWorker();
            await worker.loadLanguage('jpn+eng');
            await worker.initialize('jpn+eng');
            const { data } = await worker.detect(origImg);
            await worker.terminate();

            const res = await processScan(origImg, data.orientation_degrees || 0);
            processedImagesData.push({ orig: origImg, currentDeg: data.orientation_degrees || 0, proc: res, name: file.name });
            addPreview(res, i, file.name);
        }
        document.getElementById('log-overlay').style.display = 'none';
        document.getElementById('download-pdf').style.display = 'block';
    }

    function loadImage(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = e => { const i = new Image(); i.onload = () => res(i); i.src = e.target.result; };
            r.readAsDataURL(file);
        });
    }

    async function processScan(img, deg) {
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        let [pW, pH] = paperMap[sizeKey];
        if (orient === 'l') [pW, pH] = [pH, pW];

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = 3.5;
        canvas.width = pW * scale; canvas.height = pH * scale;
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((-deg * Math.PI) / 180);

        let imgW = img.width, imgH = img.height;
        if (deg % 180 !== 0) [imgW, imgH] = [imgH, imgW];
        const ratio = Math.max(canvas.width / imgW, canvas.height / imgH);
        ctx.filter = 'grayscale(1) contrast(1.2) brightness(1.05)';
        ctx.drawImage(img, -img.width * ratio / 2, -img.height * ratio / 2, img.width * ratio, img.height * ratio);
        ctx.restore();
        return canvas.toDataURL('image/jpeg', 0.85);
    }

    function addPreview(base64, index, filename) {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `<img id="p-img-${index}" src="${base64}"><div class="file-name">${filename}</div>`;
        item.onclick = () => {
            activeIndex = index;
            document.getElementById('comp-orig').src = processedImagesData[index].orig.src;
            document.getElementById('comp-proc').src = processedImagesData[index].proc;
            document.getElementById('comparison-area').style.display = 'block';
        };
        document.getElementById('preview-list').appendChild(item);
    }

    async function rotateCurrent(addDeg) {
        if (activeIndex < 0) return;
        const data = processedImagesData[activeIndex];
        data.currentDeg = (data.currentDeg + addDeg) % 360;
        const newRes = await processScan(data.orig, data.currentDeg);
        data.proc = newRes;
        document.getElementById('comp-proc').src = newRes;
        document.getElementById(`p-img-${activeIndex}`).src = newRes;
    }

    document.getElementById('download-pdf').onclick = () => {
        const { jsPDF } = window.jspdf;
        const sizeKey = document.getElementById('paper-size').value;
        const orient = document.getElementById('paper-orientation').value;
        const pdf = new jsPDF(orient, 'mm', sizeKey);
        processedImagesData.forEach((data, i) => {
            if (i > 0) pdf.addPage(sizeKey, orient);
            pdf.addImage(data.proc, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
        });
        pdf.save("AI_Scanned_Combined.pdf");
    };
</script>
</body>
</html>
